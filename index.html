<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Latihan Mandiri TKA Bahasa Indonesia</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; background: #fff; padding: 30px; margin: auto; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { color: #1e3a8a; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #64748b; margin-top: 0; margin-bottom: 25px; }
        
        .card-menu { background: #f8fafc; border: 1px solid #cbd5e1; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        .input-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #334155; }
        .input-group input, .input-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
        
        .btn-paket { background-color: #2563eb; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        .btn-paket:hover { background-color: #1d4ed8; }

        .hidden { display: none !important; }
        
        .question-box { margin-bottom: 25px; border: 1px solid #e2e8f0; border-radius: 8px; padding: 18px; background: #fafafa; }
        .question { font-weight: bold; margin-bottom: 12px; color: #1e293b; font-size: 16px; }
        .options label { display: block; margin-bottom: 8px; cursor: pointer; padding: 8px 10px; border-radius: 6px; }
        .options label:hover { background: #e2e8f0; }
        input[type="radio"] { margin-right: 10px; }
        
        button.submit-btn { background-color: #25d366; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 15px; }
        button.submit-btn:hover { background-color: #20ba5a; }
        
        #result { margin-top: 25px; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; display: none; margin-bottom: 15px; }
        .correct-score { color: #166534; background-color: #dcfce7; border: 1px solid #bbf7d0; }
        .incorrect-score { color: #991b1b; background-color: #fee2e2; border: 1px solid #fecaca; }
        .explanation { font-size: 14px; color: #1e40af; margin-top: 10px; background-color: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 10px 12px; display: none; }
        .user-correct { background-color: #dcfce7 !important; border: 1px solid #86efac; }
        .user-wrong { background-color: #fee2e2 !important; border: 1px solid #fca5a5; }
        
        .student-info { background: #e0f2fe; padding: 10px 15px; border-radius: 6px; margin-bottom: 20px; color: #0369a1; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .back-btn { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Portal Latihan Mandiri TKA</h2>
    <p class="subtitle">Mata Pelajaran Bahasa Indonesia - Kelas 9</p>

    <!-- HALAMAN LOGIN -->
    <div id="loginSection" class="card-menu">
        <h3>Silakan Masukkan Data Diri</h3>
        <div class="input-group">
            <label>Nama Lengkap Siswa:</label>
            <input type="text" id="namaSiswa" placeholder="Contoh: Budi Santoso">
        </div>
        <div class="input-group">
            <label>Kelas:</label>
            <input type="text" id="kelasSiswa" placeholder="Contoh: 9A">
        </div>
        <div class="input-group">
            <label>Pilih Paket Soal Tryout:</label>
            <select id="pilihPaket">
                <option value="1">Paket 1 (10 Soal)</option>
                <option value="2">Paket 2 (10 Soal)</option>
                <option value="3">Paket 3 (10 Soal)</option>
                <option value="4">Paket 4 (10 Soal)</option>
            </select>
        </div>
        <button type="button" class="btn-paket" onclick="mulaiUjian()">Mulai Latihan</button>
    </div>

    <!-- HALAMAN SOAL UTAMA -->
    <div id="quizSection" class="hidden">
        <div class="student-info">
            <span id="displayInfo"></span>
            <button type="button" class="back-btn" onclick="keluarKeMenu()">Ganti Paket</button>
        </div>

        <form id="quizForm">
            <div id="containerSoal"></div>
            <button type="button" class="submit-btn" onclick="checkAndSendWA()">✅ Kirim Jawaban & Langsung ke WhatsApp Guru</button>
        </form>

        <div id="result"></div>
    </div>
</div>

<script>
const bankSoal = {
    "1": [
        { q: "1. Berdasarkan teks 'Pantai Batu Banua', deskripsi utama yang dibahas berkaitan dengan...", opts: { A: "Sejarah perkembangan kawasan Patra", B: "Biaya masuk objek wisata pantai", C: "Lokasi geografis dan aksesibilitas Pantai Batu Banua", D: "Fasilitas dan aktivitas menyelam" }, key: "C", exp: "Pembahasan: Teks secara rinci mengulas letak geografis dan rute akses menuju lokasi pantai." },
        { q: "2. Berdasarkan informasi Kartu Identitas Anak (KIA), berapa batas usia anak yang wajib memiliki KIA?", opts: { A: "5 tahun ke bawah", B: "12 tahun ke bawah", C: "17 tahun ke bawah", D: "21 tahun ke bawah" }, key: "C", exp: "Pembahasan: Sesuai infografik KIA, kartu ini diperuntukkan bagi anak usia di bawah 17 tahun." },
        { q: "3. Apa arti kata 'rutin' dalam panduan kesehatan mata atau teks terkait?", opts: { A: "Sekali waktu", B: "Jarang dilakukan", C: "Teratur atau berkala", D: "Tanpa henti" }, key: "C", exp: "Pembahasan: Kata 'rutin' bermakna dikerjakan secara teratur atau berkala sesuai jadwal." },
        { q: "4. Pada pantun edukasi, struktur sampiran umumnya terletak pada...", opts: { A: "Baris 1 dan 2", B: "Baris 3 dan 4", C: "Seluruh baris", D: "Baris akhir" }, key: "A", exp: "Pembahasan: Baris pertama dan kedua pada pantun berfungsi sebagai sampiran." },
        { q: "5. Apa unsur intrinsik utama yang sering menonjol dalam cerita fabel (hewan)?", opts: { A: "Latar tempat luar angkasa", B: "Tokoh hewan berkarakter manusia dan pesan moral", C: "Data statistik ilmiah", D: "Kutipan ayat suci" }, key: "B", exp: "Pembahasan: Fabel menggunakan tokoh binatang yang bertingkah laku seperti manusia dengan menyisipkan pesan moral." },
        { q: "6. Bagian struktur cerita yang mulai memunculkan masalah atau konflik antartokoh disebut...", opts: { A: "Orientasi", B: "Komplikasi", C: "Resolusi", D: "Koda" }, key: "B", exp: "Pembahasan: Komplikasi adalah bagian awal munculnya ketegangan atau masalah dalam alur cerita." },
        { q: "7. Manakah kalimat yang termasuk Gagasan Pokok (bukan rincian)...", opts: { A: "Kupu-kupu tersebut memiliki bentang sayap 5 cm.", B: "Madu memiliki banyak manfaat bagi kesehatan tubuh karena kandungan gizinya.", C: "Vitamin B3 pada madu sebesar 0,1 miligram.", D: "Kalsium dalam madu tercatat 5 miligram." }, key: "B", exp: "Pembahasan: Kalimat B bersifat umum sebagai ide utama." },
        { q: "8. Majas perumpamaan yang menggunakan kata pembanding seperti 'bagai', 'seperti', atau 'laksana' disebut...", opts: { A: "Metafora", B: "Simile", C: "Personifikasi", D: "Hiperbol" }, key: "B", exp: "Pembahasan: Simile adalah majas perbandingan langsung yang memakai kata penghubung pembanding." },
        { q: "9. Penulisan tanggal surat resmi yang benar sesuai kaidah adalah...", opts: { A: "15-05-2025", B: "15 Mei 2025", C: "jakarta: 15 Mei 2025", D: "Tgl 15 Mei '25" }, key: "B", exp: "Pembahasan: Tanggal surat resmi tidak disingkat dengan angka/tanda hubung, dan nama bulan ditulis huruf kapital awal." },
        { q: "10. Bagian akhir surat resmi atau pidato perpisahan yang berisi ucapan terima kasih dan harapan biasanya masuk dalam struktur...", opts: { A: "Pembukaan", B: "Penutup", C: "Lampiran", D: "Tembusan" }, key: "B", exp: "Pembahasan: Ungkapan terima kasih dan harapan penutup diletakkan pada bagian penutup." }

        { q: "1. Berdasarkan teks Keindahan Alam Indonesia, wilayah Indonesia dijuluki sebagai paru-paru dunia karena...", opts: { A: "Memiliki lautan terluas", B: "Memiliki hutan yang sangat luas dan penting", C: "Banyak gunung berapi aktif", D: "Terletak di garis khatulistiwa" }, key: "B", exp: "Pembahasan: Hutan di Indonesia sangat luas dan berperan penting sebagai paru-paru dunia." },
        { q: "2. Berdasarkan infografik 'Piring Sehat', apa yang dianjurkan untuk mengisi setengah bagian piring?", opts: { A: "Daging merah dan lemak", B: "Buah-buahan segar dan sayuran", C: "Gorengan dan makanan cepat saji", D: "Nasi porsi ekstra" }, key: "B", exp: "Pembahasan: Porsi setengah piring dalam pedoman piring sehat diisi oleh sayur dan buah." },
        { q: "3. Apa tujuan utama pembuatan teks prosedur (seperti resep atau cara membuat keripik)?", opts: { A: "Menceritakan kisah masa lalu", B: "Memberikan petunjuk melakukan atau membuat sesuatu secara akurat", C: "Mengkritik kebijakan pemerintah", D: "Menyajikan data opini penulis" }, key: "B", exp: "Pembahasan: Teks prosedur berfungsi memberikan panduan langkah demi langkah." },
        { q: "4. Jenis paragraf yang gagasan utamanya terletak di awal paragraf disebut paragraf...", opts: { A: "Deduktif", B: "Induktif", C: "Campuran", D: "Ineratif" }, key: "A", exp: "Pembahasan: Paragraf deduktif menempatkan ide pokok di kalimat pertama." },
        { q: "5. Majas yang membandingkan benda mati seolah-olah bernyawa dan berperilaku seperti manusia adalah...", opts: { A: "Simile", B: "Personifikasi", C: "Litotes", D: "Metonimia" }, key: "B", exp: "Pembahasan: Personifikasi memberikan sifat insani kepada benda mati." },

        { q: "10. Manakah yang termasuk kalimat opini (bukan fakta)...", opts: { A: "Ibu kota Indonesia saat ini adalah Jakarta.", B: "Jumlah penduduk kota itu mencapai 2 juta jiwa.", C: "Menurut saya, pemandangan di pantai itu adalah yang paling indah di dunia.", D: "Buku setebal 400 halaman itu diterbitkan tahun 2025." }, key: "C", exp: "Pembahasan: Opsi C memuat pendapat pribadi." }
    ],
    "3": [
        { q: "1. Berdasarkan kutipan teks 'Penumpang Bus Kota', gagasan utama paragraf tersebut berkaitan dengan...", opts: { A: "Bus kota beroperasi setiap hari di dalam kota.", B: "Keberadaan bus kota membantu mobilitas masyarakat perkotaan.", C: "Sebagian penumpang sedang melihat layar ponsel.", D: "Seorang anak berdiri di dekat sopir bus." }, key: "B", exp: "Pembahasan: Gagasan utama teks menegaskan peran penting bus kota dalam membantu mobilitas warga." },
        { q: "2. Apa arti kata 'difabel' berdasarkan konteks kalimat pada teks Bus Kota?", opts: { A: "Orang lanjut usia", B: "Penyandang disabilitas", C: "Laki-laki yang memiliki keterbatasan fisik", D: "Seseorang yang perlu mendapat perhatian khusus" }, key: "C", exp: "Pembahasan: Konteks teks merujuk pada penyandang disabilitas atau difabel." },
        { q: "3. Apa tujuan utama dari pembuatan sebuah iklan komersial?", opts: { A: "Memberikan informasi atau mempromosikan produk/jasa kepada khalayak", B: "Menyampaikan laporan keuangan perusahaan", C: "Menceritakan dongeng masa lalu", D: "Menulis surat pribadi kepada teman" }, key: "A", exp: "Pembahasan: Iklan bertujuan membujuk dan menginformasikan keunggulan produk/jasa." },
        { q: "4. Dalam struktur teks tanggapan kritis, bagian yang berisi penilaian atau evaluasi terhadap suatu karya disebut...", opts: { A: "Orientasi", B: "Evaluasi / Penilaian", C: "Abstraksi", D: "Koda" }, key: "B", exp: "Pembahasan: Evaluasi memuat penilaian kritis terhadap kelebihan maupun kekurangan karya." },
        { q: "5. Apa fungsi dari pembuatan lubang resapan biopori di lingkungan rumah?", opts: { A: "Menambah genangan air hujan", B: "Membantu meresapkan air hujan ke dalam tanah serta mengelola sampah organik", C: "Tempat pembuangan limbah plastik pabrik", D: "Menyuburkan tanaman hias dengan bahan kimia" }, key: "B", exp: "Pembahasan: Biopori dibuat untuk pencegahan genangan air dan meresapkan air ke dalam tanah." },
        { q: "6. Manakah yang termasuk kalimat persuasif (mengajak)...", opts: { A: "Hari ini cuaca sangat cerah dan berawan.", B: "Mari kita jaga kebersihan lingkungan sekolah demi kesehatan bersama!", C: "Buku paket bahasa Indonesia berjumlah 200 halaman.", D: "Keluarga Budi pergi berlibur ke Bali kemarin." }, key: "B", exp: "Pembahasan: Kalimat persuasif ditandai dengan kata ajakan seperti 'mari' atau 'ayo'." },
        { q: "7. Arti istilah 'literasi' dalam konteks pendidikan modern berkaitan erat dengan kemampuan...", opts: { A: "Berhitung cepat angka matematika", B: "Memahami, mengevaluasi, dan menggunakan informasi tertulis", C: "Menggambar sketsa pemandangan", D: "Olahraga senam lantai" }, key: "B", exp: "Pembahasan: Literasi membaca mencakup pemahaman kritis terhadap teks informasi." },
        { q: "8. Apa ciri utama dari teks ulasan (resensi buku)?", opts: { A: "Berisi langkah-langkah membuat kue", B: "Mengupas keunggulan dan kelemahan suatu karya (buku/film)", C: "Memuat berita kriminal harian", D: "Berisi dialog naskah drama" }, key: "B", exp: "Pembahasan: Resensi atau ulasan menilai kualitas, isi, kelebihan, serta kekurangan sebuah karya." },
        { q: "9. Kata baku yang tepat untuk memperbaiki kata tidak baku 'apotek' adalah...", opts: { A: "Apotik", B: "Apotek", C: "Appotek", D: "Epotik" }, key: "B", exp: "Pembahasan: Kata baku dalam KBBI yang benar adalah 'apotek'." },
        { q: "10. Perhatikan kalimat: 'Ayah membaca koran di teras.' Kata yang menduduki fungsi sebagai objek adalah...", opts: { A: "Ayah", B: "Membaca", C: "Koran", D: "Di teras" }, key: "C", exp: "Pembahasan: S = Ayah, P = Membaca, O = Koran, K = Di teras." }
    ],
    "4": [
        { q: "1. Berdasarkan teks Kupu-Kupu Catopsilia pomona, manakah pernyataan yang BENAR mengenai ciri fisiknya?", opts: { A: "Hanya ditemukan di Pulau Jawa.", B: "Termasuk ke dalam keluarga kupu-kupu putih dan kuning (Pieridae).", C: "Ukuran tubuhnya tergolong sangat besar.", D: "Memiliki abdomen berwarna merah menyala." }, key: "B", exp: "Pembahasan: Sesuai teks, kupu-kupu tersebut termasuk ke dalam keluarga Pieridae." },
        { q: "2. Apa tema utama yang tepat dari puisi berjudul 'Untukmu Guru'?", opts: { A: "Kesedihan seorang guru", B: "Kekaguman dan penghormatan mendalam kepada guru", C: "Harapan murid agar cepat lulus ujian", D: "Kritik terhadap fasilitas sekolah" }, key: "B", exp: "Pembahasan: Isi puisi secara keseluruhan mencerminkan bentuk apresiasi kepada guru." },
        { q: "3. Poster kampanye kesehatan anak (seperti '7 Kebiasaan Anak Indonesia Hebat') bertujuan untuk...", opts: { A: "Menakut-nakuti siswa di sekolah", B: "Mendorong pembiasaan pola hidup sehat dan disiplin sejak dini", C: "Menjual produk makanan ringan pabrik", D: "Mengajak siswa sering bolos sekolah" }, key: "B", exp: "Pembahasan: Poster tersebut memuat edukasi kebiasaan positif harian bagi anak." },
        { q: "4. Apa dampak negatif utama jika seorang anak sering tidur terlalu larut malam karena bermain gawai?", opts: { A: "Tubuh semakin bugar dan berenergi", B: "Mudah lelah, sulit berkonsentrasi saat belajar, dan rentan sakit", C: "Nilai ujian meningkat drastis", D: "Penglihatan mata semakin tajam" }, key: "B", exp: "Pembahasan: Kurang tidur akibat gawai menurunkan konsentrasi dan kesehatan fisik." },

        { q: "7. Apa yang dimaksud dengan antonim...", opts: { A: "Persamaan makna kata", B: "Lawan makna kata", C: "Singkatan kata resmi", D: "Arti kiasan" }, key: "B", exp: "Pembahasan: Antonim adalah kata-kata yang memiliki makna berlawanan." },
        { q: "8. Dalam struktur teks berita, bagian teras berita (lead) umumnya terletak pada...", opts: { A: "Paragraf terakhir", B: "Paragraf pertama sebagai rangkuman inti peristiwa", C: "Daftar pustaka", D: "Catatan kaki" }, key: "B", exp: "Pembahasan: Teras berita berada di awal berita untuk menarik perhatian dan merangkum pokok kejadian." },
        { q: "9. Unsur berita yang menanyakan 'mengapa' suatu peristiwa terjadi berkaitan dengan aspek...", opts: { A: "What (Apa)", B: "Who (Siapa)", C: "Why (Mengapa / Alasan)", D: "Where (Di mana)" }, key: "C", exp: "Pembahasan: Unsur 'mengapa' mencakup latar belakang atau alasan terjadinya peristiwa." },
        { q: "10. Perbaikan penulisan ejaan yang salah pada kata 'sintesa' sesuai KBBI baku adalah...", opts: { A: "Sinteza", B: "Sintesis", C: "Synteca", D: "Syntesa" }, key: "B", exp: "Pembahasan: Kata baku serapan yang tepat dalam bahasa Indonesia adalah 'sintesis'." }
    ]
};

let activePaket = "1";

function mulaiUjian() {
    let nama = document.getElementById('namaSiswa').value.trim();
    let kelas = document.getElementById('kelasSiswa').value.trim();
    let selectPaket = document.getElementById('pilihPaket');
    activePaket = selectPaket.value;

    if(nama === "" || kelas === "") {
        alert("Mohon masukkan Nama Lengkap dan Kelas terlebih dahulu!");
        return;
    }

    document.getElementById('displayInfo').innerHTML = `Siswa: <b>${nama}</b> (Kelas: ${kelas}) | Paket Soal: <b>Paket ${activePaket}</b>`;
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('quizSection').classList.remove('hidden');

    renderSoal(activePaket);
    window.scrollTo(0, 0);
}

function keluarKeMenu() {
    document.getElementById('quizSection').classList.add('hidden');
    document.getElementById('loginSection').classList.remove('hidden');
    document.getElementById('result').style.display = 'none';
}

function renderSoal(paketId) {
    let soalList = bankSoal[paketId];
    let html = "";

    soalList.forEach((item, index) => {
        let num = index + 1;
        html += `<div class="question-box" id="box${num}">
            <div class="question">${item.q}</div>
            <div class="options">`;
        
        for(let key in item.opts) {
            html += `<label id="lbl${num}_${key}"><input type="radio" name="q${num}" value="${key}"> ${key}. ${item.opts[key]}</label>`;
        }

        html += `</div>
            <div class="explanation" id="exp${num}"><b>Pembahasan:</b> ${item.exp}</div>
        </div>`;
    });

    document.getElementById('containerSoal').innerHTML = html;
    document.getElementById('result').style.display = 'none';
}

function checkAndSendWA() {
    let globalNama = document.getElementById('namaSiswa').value.trim();
    let globalKelas = document.getElementById('kelasSiswa').value.trim();
    let soalList = bankSoal[activePaket];
    let globalTotal = soalList.length;
    let globalScore = 0;

    for(let i=1; i<=globalTotal; i++) {
        let q = document.querySelector('input[name="q'+i+'"]:checked');
        if(!q) {
            alert("Harap jawab semua 10 soal pada paket ini terlebih dahulu!");
            return;
        }
    }

    for(let i=0; i<globalTotal; i++) {
        let num = i + 1;
        let selected = document.querySelector('input[name="q'+num+'"]:checked').value;
        let correctKey = soalList[i].key;

        document.getElementById('exp'+num).style.display = 'block';

        let selectedLabel = document.getElementById('lbl'+num+'_'+selected);
        let correctLabel = document.getElementById('lbl'+num+'_'+correctKey);

        if(selected === correctKey) {
            globalScore++;
            selectedLabel.classList.add('user-correct');
        } else {
            selectedLabel.classList.add('user-wrong');
            correctLabel.classList.add('user-correct');
        }
    }

    let resultDiv = document.getElementById('result');
    resultDiv.style.display = 'block';

    let percentage = (globalScore / globalTotal) * 100;
    if(percentage >= 80) {
        resultDiv.className = "correct-score";
        resultDiv.innerHTML = `Hebat! Skor Anda: ${globalScore} dari ${globalTotal} (${percentage}%). Pesan WhatsApp akan otomatis terbuka!`;
    } else {
        resultDiv.className = "incorrect-score";
        resultDiv.innerHTML = `Skor Anda: ${globalScore} dari ${globalTotal} (${percentage}%). Pesan WhatsApp akan otomatis terbuka!`;
    }

    window.scrollTo(0, document.body.scrollHeight);

    // Otomatis langsung membuka WhatsApp dalam 1 klik
    setTimeout(function() {
        let nomorWa = "6283822993789";
        let pesan = `Halo Pak Guru, saya sudah selesai mengerjakan latihan TKA.%0A%0A` +
                    `Nama: *${globalNama}*%0A` +
                    `Kelas: *${globalKelas}*%0A` +
                    `Paket Soal: *Paket ${activePaket}*%0A` +
                    `Skor Hasil: *${globalScore} dari ${globalTotal}*`;

        let urlWA = `https://wa.me/${nomorWa}?text=${pesan}`;
        window.open(urlWA, '_blank');
    }, 1000);
}
</script>
